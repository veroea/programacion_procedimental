<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
    <title>Formulario de usuario</title>
  </head>
  <body>
    <div class="field">
      <label class="label">Nombre</label>
      <div class="control">
        <input class="input" type="text" placeholder="Nombre..." />
      </div>
    </div>
    <br /><br />

    <div class="field">
      <label class="label">Apellido</label>
      <div class="control">
        <input class="input" type="text" placeholder="Apellido..." />
      </div>
    </div>
    <br /><br />

    <div class="field">
      <label class="label">Tipo de documento</label>
      <div class="control">
        <div class="select">
          <select>
            <option>Cédula</option>
            <option>Tarjeta de identidad</option>
            <option>Otro</option>
          </select>
        </div>
      </div>
    </div>
    <br /><br />

    <div class="field">
      <div class="control">
        <label class="label">Número de documento</label>
        <input
          type="number"
          id="documento"
          name="documento"
          placeholder="Ingresa tu número de documento"
          required
        />
      </div>
    </div>
    <br /><br />

    <div class="field">
      <div class="control">
        <label class="label">Número de telefono</label>
        <input
          type="number"
          id="telefono"
          name="telefono"
          placeholder="Ingresa tu número"
          required
        />
      </div>
    </div>
    <br /><br />

    <div class="field">
      <div class="control">
        <label class="label">Email</label>
        <div class="control has-icons-left has-icons-right">
          <input class="input is-danger" type="email" placeholder="Email..." />
          <span class="icon is-small is-left">
            <i class="fas fa-envelope"></i>
          </span>
          <span class="icon is-small is-right">
            <i class="fas fa-exclamation-triangle"></i>
          </span>
        </div>
        <p class="help is-danger"></p>
      </div>
    </div>
    <br /><br />

    <div class="field">
      <div class="control">
        <label class="label">Genero</label>

        <div class="select">
          <select>
            <option>Femenino</option>
            <option>Masculino</option>
            <option>Otro</option>
          </select>
        </div>
      </div>
    </div>
    <br /><br />

    <div class="field">
      <label class="label">Cargo</label>
      <div class="control">
        <div class="select">
          <select>
            <option>Usuario</option>
            <option>Administrador</option>
            <option>Otro</option>
          </select>
        </div>
      </div>
    </div>
    <br /><br />

    <div class="field">
      <label class="label">Fecha de nacimiento</label>

      <input type="date" id="start" name="trip-start" value="2018-07-22" />
    </div>
    <br /><br />

    <div class="field">
      <label class="label">Contraseña</label>
      <input class="input is-link" type="text" placeholder="contraseña..." />
    </div>
    <br /><br />

    <div class="field is-grouped">
      <div class="control">
        <button class="button is-link">Enviar</button>
      </div>
      <div class="control">
        <button class="button is-link is-light">Cancelar</button>
      </div>
    </div>
    <br /><br />
  </body>
</html>
