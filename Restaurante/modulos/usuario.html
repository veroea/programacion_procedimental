<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- BULMA -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
    <link rel="stylesheet" href="/css/usuario.css">

    <!-- ICONOS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <title>Formulario de usuario</title>
  </head>

  <body>
    <div class="contenedor">
      <!-- TITULO -->
      <div class="titulo">👤 REGISTRO DE USUARIO</div>

      <p class="subtitulo">Completa la información del usuario</p>

      <div class="contenido">
        <!-- IZQUIERDA -->
        <div class="izquierda">
          <figure class="image">
            <img
              class="foto-usuario"
              src="https://cdn-icons-png.flaticon.com/128/16792/16792585.png"
              alt="Usuario"
            />
          </figure>

          <div class="field" style="width: 100%">
            <label class="label">Nombre</label>

            <div class="control has-icons-left">
              <input class="input" type="text" placeholder="Nombre..." />

              <span class="icon is-small is-left">
                <i class="fa-solid fa-user"></i>
              </span>
            </div>
          </div>

          <div class="field" style="width: 100%">
            <label class="label">Apellido</label>

            <div class="control has-icons-left">
              <input class="input" type="text" placeholder="Apellido..." />

              <span class="icon is-small is-left">
                <i class="fa-solid fa-user-tag"></i>
              </span>
            </div>
          </div>
        </div>

        <!-- DERECHA -->
        <div class="derecha">
          <div class="columns is-multiline">
            <!-- TIPO DOCUMENTO -->
            <div class="column is-6">
              <div class="field">
                <label class="label">Tipo de documento</label>

                <div class="control">
                  <div class="select is-fullwidth">
                    <select>
                      <option>Cédula</option>
                      <option>Tarjeta de identidad</option>
                      <option>Otro</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>

            <!-- DOCUMENTO -->
            <div class="column is-6">
              <div class="field">
                <label class="label">Número de documento</label>

                <div class="control has-icons-left">
                  <input
                    class="input"
                    type="number"
                    placeholder="Documento..."
                  />

                  <span class="icon is-small is-left">
                    <i class="fa-solid fa-id-card"></i>
                  </span>
                </div>
              </div>
            </div>

            <!-- TELEFONO -->
            <div class="column is-6">
              <div class="field">
                <label class="label">Número de teléfono</label>

                <div class="control has-icons-left">
                  <input
                    class="input"
                    type="number"
                    placeholder="Telefono..."
                  />

                  <span class="icon is-small is-left">
                    <i class="fa-solid fa-phone"></i>
                  </span>
                </div>
              </div>
            </div>

            <!-- EMAIL -->
            <div class="column is-6">
              <div class="field">
                <label class="label">Email</label>

                <div class="control has-icons-left">
                  <input class="input" type="email" placeholder="@..." />

                  <span class="icon is-small is-left">
                    <i class="fa-solid fa-envelope"></i>
                  </span>
                </div>
              </div>
            </div>

            <!-- GENERO -->
            <div class="column is-6">
              <div class="field">
                <label class="label">Genero</label>

                <div class="control">
                  <div class="select is-fullwidth">
                    <select>
                      <option>Femenino</option>
                      <option>Masculino</option>
                      <option>Otro</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>

            <!-- CARGO -->
            <div class="column is-6">
              <div class="field">
                <label class="label">Cargo</label>

                <div class="control">
                  <div class="select is-fullwidth">
                    <select>
                      <option>Usuario</option>
                      <option>Administrador</option>
                      <option>Otro</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>

            <!-- FECHA -->
            <div class="column is-6">
              <div class="field">
                <label class="label">Fecha de nacimiento</label>

                <div class="control has-icons-left">
                  <input class="input" type="date" />

                  <span class="icon is-small is-left">
                    <i class="fa-solid fa-calendar"></i>
                  </span>
                </div>
              </div>
            </div>

            <!-- CONTRASEÑA -->
            <div class="column is-6">
              <div class="field">
                <label class="label">Contraseña</label>

                <div class="control has-icons-left">
                  <input
                    class="input"
                    type="password"
                    placeholder="Contraseña..."
                  />

                  <span class="icon is-small is-left">
                    <i class="fa-solid fa-lock"></i>
                  </span>
                </div>
              </div>
            </div>

            <!-- BOTONES -->
            <div class="column is-12">
              <div class="botones">
                <button class="button is-purple is-fullwidth">
                  <i class="fa-solid fa-paper-plane mr-2"></i>
                  Enviar
                </button>

                <button class="button is-dark-custom is-fullwidth">
                  <i class="fa-solid fa-xmark mr-2"></i>
                  Cancelar
                </button>
              </div>
            </div>
            <div
              style="display: flex; justify-content: center; margin-top: 20px"
            >
              <a
                href="../index.html"class="btn-volver">
                Volver al inicio
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="../js/usuario.js"></script>
  </body>
</html>
