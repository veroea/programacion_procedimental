<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedidos</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css"
    />
    <link rel="stylesheet" href="/css/pedidos.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <div class="pedido-box">
      <h1 class="title is-2">Pedidos</h1>
      <p class="subtitle">Haz tu pedido de manera rápida y fácil!</p>

      <div class="box-info">
        <p class="info-text">
          Completa todos los datos para enviar tu pedido correctamente.
        </p>
      </div>

      <form>
        <div class="columns">
          <!-- Columna izquierda -->
          <div class="column">
            <!-- Nombre -->
            <div class="field">
              <label class="label">Nombre del usuario</label>
              <div class="control has-icons-left">
                <input
                  id="nombreUsuario"
                  class="input"
                  type="text"
                  placeholder="Ingresa tu nombre"
                />
                <span class="icon is-small is-left">
                  <i class="fa-solid fa-user"></i>
                </span>
              </div>
            </div>

            <!-- Producto -->
            <div class="field">
              <label class="label">Producto</label>
              <div class="control has-icons-left">
                <input
                  id="producto"
                  class="input"
                  type="text"
                  placeholder="Ej: Banana split"
                />
                <span class="icon is-small is-left">
                  <i class="fa-solid fa-utensils"></i>
                </span>
              </div>
            </div>

            <!-- Cantidad -->
            <div class="field">
              <label class="label">Cantidad</label>
              <div class="control has-icons-left">
                <input id="cantidad" class="input" type="number" placeholder="Cantidad" />
                <span class="icon is-small is-left">
                  <i class="fa-solid fa-hashtag"></i>
                </span>
              </div>
            </div>
          </div>

          <!-- Columna derecha -->
          <div class="column">
            <!-- Dirección -->
            <div class="field">
              <label class="label">Dirección</label>
              <div class="control has-icons-left">
                <input
                  id="direccion"
                  class="input"
                  type="text"
                  placeholder="Ingresa tu dirección"
                />
                <span class="icon is-small is-left">
                  <i class="fa-solid fa-location-dot"></i>
                </span>
              </div>
            </div>

            <!-- Teléfono -->
            <div class="field">
              <label class="label">Teléfono</label>
              <div class="control has-icons-left">
                <input
                  id="telefono"
                  class="input"
                  type="tel"
                  placeholder="Número telefónico"
                />
                <span class="icon is-small is-left">
                  <i class="fa-solid fa-phone"></i>
                </span>
              </div>
            </div>

            <!-- Método de pago -->
            <div class="field">
              <label class="label">Método de pago</label>
              <div class="control">
                <div class="select is-fullwidth">
                  <select id="metodoPago">
                    <option>Selecciona un método</option>
                    <option>Efectivo</option>
                    <option>Tarjeta</option>
                    <option>Transferencia</option>
                    <option>Nequi</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Observaciones -->
        <div class="field">
          <label class="label">Observaciones</label>
          <div class="control">
            <textarea
              id="observaciones"
              class="textarea"
              placeholder="Copia aqui como deseas que sea tu pedido..."
            ></textarea>
          </div>
        </div>

        <!-- Botón -->
        <div class="field mt-5">
          <div class="control">
            <button 
              type="button" 
              class="button is-purple is-fullwidth is-medium"
              onclick="ValidarDatos()">

              <i class="fa-solid fa-paper-plane mr-2"></i>
              Enviar Pedido
            </button>
          </div>
        </div>
        <div style="display: flex; justify-content: center; margin-top: 20px">
        <a
                href="../index.html"class="btn-volver">
                Volver al inicio
              </a>
        </div>
      </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src = "../js/pedidos.js"></script>
  </body>
</html>
