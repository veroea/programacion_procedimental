<html lang="en">
  <head>
    <meta charset="UTF-8" />

  <body>
    <div class="container">
      <div class="contenedor">
        <div class="titulo">CONTABILIDAD</div>

        <p class="subtitulo">Control financiero del restaurante</p>

        <div class="contenido">
          <!-- COLUMNA IZQUIERDA -->
          <div class="izquierda">
            <figure class="image">
              <img
                class="foto-usuario"
                src="https://cdn-icons-png.flaticon.com/128/16792/16792585.png"
                alt="Usuario"
              />
            </figure>

            <div class="field" style="width: 100%">
              <label class="label">Usuario</label>

              <div class="control has-icons-left">
                <input
                  class="input"
                  type="text"
                  id="nombre"
                  placeholder="Nombre del usuario"
                />

                <span class="icon is-small is-left">
                  <i class="fa-solid fa-user"></i>
                </span>
              </div>
            </div>
          </div>

          <!-- COLUMNA DERECHA -->
          <div class="derecha">
            <div class="columns is-multiline">
              <!-- VENTAS -->
              <div class="column is-6">
                <div class="field">
                  <label class="label">Ventas</label>

                  <div class="control has-icons-left">
                    <input
                      class="input"
                      type="text"
                      id="ventas"
                      placeholder="Ventas realizadas"
                    />

                    <span class="icon is-small is-left">
                      <i class="fa-solid fa-cart-shopping"></i>
                    </span>
                  </div>
                </div>
              </div>

              <!-- FECHA -->
              <div class="column is-6">
                <div class="field">
                  <label class="label">Fecha</label>

                  <div class="control has-icons-left">
                    <input class="input" type="date" id="fecha" />
                    <input class="input" type="date" />


                    <span class="icon is-small is-left">
                      <i class="fa-solid fa-calendar"></i>
                    </span>
                  </div>
                </div>
              </div>

              <!-- INGRESOS -->
              <div class="column is-6">
                <div class="field">
                  <label class="label">Ingresos</label>

                  <div class="control has-icons-left">
                    <input class="input" type="number" id="ingresos" placeholder="Ingresos" />
                    <input class="input" type="number" placeholder="Ingresos" />


                    <span class="icon is-small is-left">
                      <i class="fa-solid fa-arrow-trend-up"></i>
                    </span>
                  </div>
                </div>
              </div>

              <!-- EGRESOS -->
              <div class="column is-6">
                <div class="field">
                  <label class="label">Egresos</label>

                  <div class="control has-icons-left">
                    <input class="input" type="number" id="egresos" placeholder="Egresos" />
                    <input class="input" type="number" placeholder="Egresos" />


                    <span class="icon is-small is-left">
                      <i class="fa-solid fa-arrow-trend-down"></i>
                    </span>
                  </div>
                </div>
              </div>

              <!-- CONCEPTO -->
              <div class="column is-12">
                <div class="field">
                  <label class="label">Concepto</label>

                  <div class="control">
                    <textarea
                      class="textarea"
                      id="conceptos"
                      placeholder="Escribe el concepto"
                    ></textarea>
                  </div>
                </div>
              </div>

              <!-- VALOR -->
              <div class="column is-12">
                <div class="field">
                  <label class="label">Valor</label>

                  <div class="control has-icons-left">
                    <input
                      class="input"
                      type="number"
                      id="valor"
                      placeholder="Valor total"
                    />

                    <span class="icon is-small is-left">
                      <i class="fa-solid fa-dollar-sign"></i>
                    </span>
                  </div>
                </div>
              </div>

              <!-- BOTONES -->
              <div class="column is-12">
                <div class="botones">
                  <button class="button is-purple is-fullwidth">
                    <i class="fa-solid fa-floppy-disk mr-2"></i>
                    Guardar información
                  </button>

                  <button class="button is-dark-custom is-fullwidth">
                    <i class="fa-solid fa-xmark mr-2"></i>
                    Cancelar
                  </button>
                </div>
              </div>
              <div
                style="display: flex; justify-content: center; margin-top: 20px"
              >
                <a
                  href="../index.html">
                  <i
                    class="fa-solid fa-arrow-left"
                    style="margin-right: 8px"
                  ></i>

                  Volver al inicio
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
